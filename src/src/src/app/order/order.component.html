<div class="wrapper" *ngIf="movie">

    <mat-card class="order-card" appearance="outlined">
        <img class="poster" src="{{movie.poster}}" alt="{{movie.originalTitle}}"/>

        <mat-card-content>
            <h3>new order - {{movie.originalTitle}}</h3>

            <mat-form-field class="full-width">
                <mat-label> Movie title </mat-label>
                <input type="text" matInput [value]="movie.originalTitle" disabled>
              </mat-form-field>

              <mat-form-field class="full-width">
                <mat-label> Movie direcotr</mat-label>
                <input type="text" matInput [value]="movie.director.name" disabled>
              </mat-form-field>

              

              <mat-form-field class="full-width">
                <mat-label> start time </mat-label>
                <input type="text" matInput [value]="movie.startDate" disabled>
              </mat-form-field>

              <mat-form-field class="full-width">
                <mat-label> Duration (minutes) </mat-label>
                <input type="text" matInput [value]="movie.runTime" disabled> 
              </mat-form-field>

              <mat-form-field class="full-width">
                <mat-label> Movie description </mat-label>
                <input type="text" matInput [value]="movie.description" disabled>
              </mat-form-field >

              <mat-form-field>
                <mat-label>Location
                 <mat-select [(ngModel)]="selectedLocation">
                    <mat-option *ngFor="let detalj of detalji" [value]="detalj.id">{{detalj.location}}</mat-option>
                </mat-select>
                        </mat-label>
                        </mat-form-field>


              <mat-form-field class="full-width">
                <mat-label>Price</mat-label>
                          <mat-select class="full-width" [(value)]="selectedPrice">
                            <mat-option [value]="4">Studentska - 4 &euro;</mat-option>
                            <mat-option [value]="8">Normalna - 8 &euro;</mat-option>
                            <mat-option [value]="12">Vip - 12 &euro;</mat-option>
                          </mat-select>
            </mat-form-field>

            <mat-form-field class="full-width">
              <mat-label>Ticket Count</mat-label>
              <input type="number" matInput [(ngModel)]="selectedTicketCount"> 
          </mat-form-field>

            
        </mat-card-content>

 

        <mat-card-actions>


            <button mat-button (click)="doOrder()"><i class="fa-solid fa-cart-shopping"></i>
              Buy ticket</button>
</mat-card-actions>

    </mat-card>

</div>
